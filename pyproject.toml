[project]
name = "notlonggraph"
version = "0.1.0"
description = "A from-scratch reimplementation of LangGraph's execution core (Pregel/BSP graph engine, channels, checkpointing, hooks)"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Julien Brousse" },
]
requires-python = ">=3.12"
dependencies = [
    "textual>=8.2.7",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/Lejusdefruits/NotLongGraph"
Repository = "https://github.com/Lejusdefruits/NotLongGraph"
Issues = "https://github.com/Lejusdefruits/NotLongGraph/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["notlonggraph"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
